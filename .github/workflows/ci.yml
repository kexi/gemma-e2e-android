name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # gitleaks scans history, which needs every commit present.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: DeterminateSystems/nix-installer-action@786fff0690178f1234e4e1fe9b536e94f5433196 # v20
      # Evaluation only: the Android SDK and system images are several GB and
      # would dominate CI time without catching anything an eval misses.
      - run: nix flake check --no-build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run fmt:check
      - run: bun run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # The Firestore emulator is a JAR; firebase-tools 15 refuses anything
      # older than JDK 21. The devshell's zulu17 exists for AGP, which CI does
      # not build, so this job needs only the newer JVM.
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: zulu
          java-version: "21"
      - run: bun install --frozen-lockfile
      # bunx with a pinned version rather than the devshell's firebase-tools:
      # this job never enters Nix, and an unpinned CLI would silently change
      # under the workflow.
      - run: >-
          bunx firebase-tools@15.19.1 emulators:exec
          --only firestore --project demo-gemma-e2e 'bun test'
