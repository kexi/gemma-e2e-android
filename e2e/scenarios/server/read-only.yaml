# Read-only commands against a live dashboard (`just web` on :5175).
#
# Only listings and lookups are exercised: `run start` would drive the emulator
# and an LLM, which is neither fast nor deterministic enough to assert on here.
# Nothing in this scenario writes, so it is safe to re-run.
#
# `models` is deliberately not here: it is the one read-only command that needs
# more than the dashboard, because /api/models proxies LM Studio and answers 503
# when it is down. Asserting it alongside these would make the whole file red on
# a machine running only `just web`, so it lives in models.yaml instead.
name: server-read-only
env:
  NO_COLOR: "1"
  TERM: dumb
steps:
  - spawn: "${GEMMA_E2E_BIN} scenario list"
  - expect:
      contains: "ID"
      timeout: 15s
  - expect:
      contains: "CASES"
      timeout: 15s
  - expect_exit:
      code: 0
      timeout: 15s

  # --json swaps the table for one JSON document, so the table header must be gone.
  - spawn: "${GEMMA_E2E_BIN} scenario list --json"
  - expect:
      contains: '"id":'
      timeout: 15s
  - expect_not:
      contains: "CASES"
  - expect_exit:
      code: 0
      timeout: 15s

  - spawn: "${GEMMA_E2E_BIN} run list"
  - expect:
      contains: "RUN ID"
      timeout: 15s
  - expect_exit:
      code: 0
      timeout: 15s

  # A lookup that finds nothing is a failed request, not a usage mistake, so it
  # exits 2 without the "Try --help" hint.
  - spawn: "${GEMMA_E2E_BIN} scenario get no-such-scenario-xyz"
  - expect:
      contains: "no such scenario: no-such-scenario-xyz"
      timeout: 15s
  - expect_not:
      contains: "Try 'gemma-e2e"
  - expect_exit:
      code: 2
      timeout: 15s

  - spawn: "${GEMMA_E2E_BIN} run get no-such-run-xyz"
  - expect:
      contains: "no such run"
      timeout: 15s
  - expect_exit:
      code: 2
      timeout: 15s
