# `scenario apply` validates each file locally before sending it. Every case
# here points at a dead server, so reaching a validation message instead of a
# connection error is what proves the check happens client-side.
name: cli-scenario-apply-validation
env:
  NO_COLOR: "1"
  TERM: dumb
workspace:
  cwd: ..
steps:
  - spawn: "${GEMMA_E2E_BIN} --server=http://127.0.0.1:1 scenario apply fixtures/does-not-exist.yaml"
  - expect:
      contains: "fixtures/does-not-exist.yaml: cannot be read"
      timeout: 10s
  - expect_not:
      contains: "cannot reach the server"
  - expect_exit:
      code: 2
      timeout: 10s

  - spawn: "${GEMMA_E2E_BIN} --server=http://127.0.0.1:1 scenario apply fixtures/malformed.yaml"
  - expect:
      contains: "fixtures/malformed.yaml: is not valid YAML"
      timeout: 10s
  - expect_not:
      contains: "cannot reach the server"
  - expect_exit:
      code: 2
      timeout: 10s

  - spawn: "${GEMMA_E2E_BIN} --server=http://127.0.0.1:1 scenario apply fixtures/incomplete.yaml"
  - expect:
      contains: "fixtures/incomplete.yaml: is not a valid scenario"
      timeout: 10s
  - expect:
      contains: "cases: Required"
      timeout: 10s
  - expect_not:
      contains: "cannot reach the server"
  - expect_exit:
      code: 2
      timeout: 10s

  # A bad --server is one mistake about the invocation, not one per file, so
  # applying several files reports it once and with the "gemma-e2e:" prefix the
  # other commands carry. `expect` consumes the match it finds, so the trailing
  # `expect_not` is what pins it to a single occurrence: a second copy would
  # still be in the buffer for it to find. Both files are valid, so nothing but
  # the server setting can be what stops this.
  - spawn: "${GEMMA_E2E_BIN} --server=not-a-url scenario apply ../scenarios/login.yaml ../scenarios/shop.yaml"
  - expect:
      contains: 'gemma-e2e: invalid --server value "not-a-url": not a URL'
      timeout: 10s
  - expect_not:
      contains: "invalid --server value"
  - expect_exit:
      code: 2
      timeout: 10s

  # The same holds for a dashboard that is not listening: starting it is one
  # remedy for the whole invocation, so it is not repeated per file either.
  - spawn: "${GEMMA_E2E_BIN} --server=http://127.0.0.1:1 scenario apply ../scenarios/login.yaml ../scenarios/shop.yaml"
  - expect:
      contains: "gemma-e2e: cannot reach the server at http://127.0.0.1:1"
      timeout: 15s
  - expect_not:
      contains: "cannot reach the server"
  - expect_exit:
      code: 2
      timeout: 15s

  # apply takes at least one file; with none there is nothing to validate.
  - spawn: "${GEMMA_E2E_BIN} scenario apply"
  - expect:
      contains: "gemma-e2e: missing scenario file"
      timeout: 10s
  - expect:
      contains: "Try 'gemma-e2e scenario apply --help' for more information."
      timeout: 10s
  - expect_exit:
      code: 2
      timeout: 10s
