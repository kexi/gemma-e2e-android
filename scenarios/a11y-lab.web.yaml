# Persona review against screens with known, planted visual accessibility
# problems: ?lab=a11y in the example web app puts colour-only status, tiny pale
# text and crowded icons between two clean screens. The operating prompt only
# pages through them; the review of each screenshot is what this scenario
# exercises.
#
# One persona per case. Reviewing the four visual presets in one request made
# Gemma 4 26B-A4B (thinking on) reason for up to a minute per screen, and on the
# crowded screen it once looped until the deadline; a11y-lab-all.web.yaml keeps
# that configuration for comparison. The model must accept images and comes from
# LLM_MODEL, as for the other scenarios.
#
# Tagged a11y and lab but not web: every step adds an image review, so a run of
# everything tagged web should not pick these up by accident.
title: Accessibility lab (web)
tags: [a11y, lab]
target:
  platform: web
  url: http://localhost:5174/?lab=a11y
cases:
  - id: red-green
    title: Red-green review of the lab screens
    prompt: &prompt >-
      Page through the store's information screens. On each screen, press the
      "Next" button. When the screen titled "You're all set" is shown, finish
      with passed.
    maxSteps: 12
    personaReview:
      personas:
        - id: red-green
          label: 赤・緑の見分けにくさ
          description: 赤と緑の違いを識別しにくい利用者。状態・操作・グラフの区別が色だけに依存せず、文字・形・模様でも伝わるか確認する。
  - id: blue-yellow
    title: Blue-yellow review of the lab screens
    prompt: *prompt
    maxSteps: 12
    personaReview:
      personas:
        - id: blue-yellow
          label: 青・黄の見分けにくさ
          description: 青と黄などの色の違いを識別しにくい利用者。情報の区別を色だけに依存させていないか確認する。
  - id: presbyopia
    title: Presbyopia review of the lab screens
    prompt: *prompt
    maxSteps: 12
    personaReview:
      personas:
        - id: presbyopia
          label: 老眼・近くの文字の読みづらさ
          description: 近くの小さな文字に焦点を合わせにくい利用者。小さい文字、細い線、情報の詰め込み、低いコントラストによる読みにくさを確認する。画像から実際の文字サイズや視距離を断定しない。
  - id: low-vision
    title: Low-vision review of the lab screens
    prompt: *prompt
    maxSteps: 12
    personaReview:
      personas:
        - id: low-vision
          label: 弱視・細部の見えづらさ
          description: 文字やアイコンの細部を認識しにくい利用者。文字・背景・操作部品の区別、視覚的な密集、重要情報の目立ちやすさを確認する。
